# Apache for the Tests workflow: serves docroot on port 80, applies
# docroot/.htaccess like production, and passes PHP to php-fpm
# (.github/ci/php-fpm.conf). .github/ci/start-web-server.sh installs it as the
# default site and sets PROJECT_DIR in /etc/apache2/envvars.
ServerName localhost

<VirtualHost *:80>
  DocumentRoot ${PROJECT_DIR}/docroot
  <Directory ${PROJECT_DIR}/docroot>
    AllowOverride All
    Require all granted
  </Directory>
  <FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:9000"
  </FilesMatch>
  ErrorLog ${PROJECT_DIR}/artifacts/apache-error.log
  CustomLog ${PROJECT_DIR}/artifacts/apache-access.log combined
</VirtualHost>
