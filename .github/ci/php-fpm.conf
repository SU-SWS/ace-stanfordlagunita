; php-fpm for the Tests workflow; Apache passes PHP requests to it
; (.github/ci/apache.conf, started by .github/ci/start-web-server.sh). Relative
; paths are under the prefix (-p), the repository root.
[global]
error_log = artifacts/php-fpm.log

[www]
listen = 127.0.0.1:9000
pm = static
pm.max_children = 8
; Keep the job's environment, which the settings read (CI, STANFORD_ENCRYPT).
clear_env = no
catch_workers_output = yes
