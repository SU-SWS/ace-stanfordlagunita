name: Release

on:
  pull_request:
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: write-all
    if: github.event.pull_request.merged
    steps:
      - name: Get Next Release
        id: tag
        uses: K-Phoen/semver-release-action@master
        with:
          release_strategy: none
          release_branch: 4.x
          tag_format: "4.%minor%.%patch%"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "Creating new release for $TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Create Release
        if: steps.tag.outputs.tag
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.tag.outputs.tag }}
          tag: ${{ steps.tag.outputs.tag }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          makeLatest: true
      - uses: actions/checkout@v7
        if: steps.tag.outputs.tag
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-project
        if: steps.tag.outputs.tag
      - name: Install SSH key
        if: steps.tag.outputs.tag
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Deploy Tag
        if: steps.tag.outputs.tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config --global user.email "sws-developers@lists.stanford.edu"
          git config --global user.name "Github Actions"
          ssh-keyscan -t rsa svn-45197.prod.hosting.acquia.com >> ~/.ssh/known_hosts
          ssh-keyscan -t rsa svn-23450.prod.hosting.acquia.com >> ~/.ssh/known_hosts
          git reset --hard
          drush sws:artifact:deploy --tag="$(date +'%Y-%m-%d')_$TAG" --no-interaction
