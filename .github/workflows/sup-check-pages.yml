name: Check SUP Paths
on:
#  schedule:
#    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dow:
        description: 'Day of week batch'
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
permissions:
  contents: read
jobs:
  check-pages:
    name: Check for 200 responses on SUP pages
    runs-on: ubuntu-24.04
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          cache-key: ${{ vars.CACHE_KEY }}
      - name: Invalidate 404 paths
        env:
          SUP_REVALIDATION: ${{ secrets.SUP_REVALIDATION }}
          DOW: ${{ inputs.dow }}
        run: .github/sup-check-pages.sh "$SUP_REVALIDATION" "$DOW"
