name: Clean Databases & Git
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ACQUIA_APP_KEY: ${{ secrets.ACQUIA_APP_KEY }}
  ACQUIA_APP_SECRET: ${{ secrets.ACQUIA_APP_SECRET }}
  # The Acquia applications to clean up.
  APP_IDS: >-
    5d2dbbe5-3255-417b-b398-4c1086cec925
    12c62419-8d5c-40e1-b7ab-f7999e0cc3e9
    4207734d-7ccd-4a06-8426-4108761c3e10
    8449683b-500e-4728-b70a-5f69d9e8a61a
jobs:
  database-cleanup:
    name: Clean up old database backups
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          cache-key: ${{ vars.CACHE_KEY }}
      - name: Delete old database backups
        run: |
          for app_id in $APP_IDS; do
            drush sws:acquia:clean-databases --app-id="$app_id" --app-key="$ACQUIA_APP_KEY" --app-secret="$ACQUIA_APP_SECRET"
          done
  git-cleanup:
    name: Clean up unused git branches & tags
    runs-on: ubuntu-24.04
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          cache-key: ${{ vars.CACHE_KEY }}
      - name: Delete unused git branches & tags
        run: |
          ssh-keyscan -t rsa svn-45197.prod.hosting.acquia.com >> ~/.ssh/known_hosts
          ssh-keyscan -t rsa svn-23450.prod.hosting.acquia.com >> ~/.ssh/known_hosts
          for app_id in $APP_IDS; do
            drush sws:acquia:clean-git --app-id="$app_id" --app-key="$ACQUIA_APP_KEY" --app-secret="$ACQUIA_APP_SECRET" -n
            # Each run clones its application's repository into deploy/.
            rm -rf deploy
          done
