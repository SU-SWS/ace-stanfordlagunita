name: Deploy Main Branch Artifact
on:
  push:
    branches:
      - '4.x'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy Main Artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Deploy artifact
        run: |
          git config --global user.email "sws-developers@lists.stanford.edu"
          git config --global user.name "Github Actions"
          ssh-keyscan -t rsa svn-45197.prod.hosting.acquia.com >> ~/.ssh/known_hosts
          ssh-keyscan -t rsa svn-23450.prod.hosting.acquia.com >> ~/.ssh/known_hosts
          git checkout composer.lock
          drush sws:artifact:deploy -v -n
