name: Tests
on: [push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - name: Restore Cache
        uses: actions/cache@v6
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            4.x-${{ vars.CACHE_KEY }}-
      - name: Run Unit Tests
        env:
          CC_TEST_REPORTER_ID: ${{secrets.CC_TEST_REPORTER_ID}}
        run: |
          git config --system --add safe.directory '*' &&
          composer install -n &&
          mkdir -p docroot/sites/simpletest &&
          drush sws:source:tests:phpunit --db-host=mysql --db-pass=drupal --db-name=drupal --db-user=drupal --with-coverage &&
          drush sws:tests:phpunit-coverage-check artifacts/phpunit/coverage/xml --clover-file=artifacts/phpunit/coverage/clover.xml -n
      - name: Save Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-tests-results
          path: $GITHUB_WORKSPACE/artifacts
  sites_to_test:
    name: Sites to test
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore Cache
        uses: actions/cache@v6
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            4.x-${{ vars.CACHE_KEY }}-
      - name: Get Sites
        id: set-matrix
        run: |
          composer install -n &&
          SITES=$(echo -n "$(drush sws:drush-config command.sws.options.multisites | grep -v default)" | jq -R -s -c 'split("\n") | sort') &&
          echo "matrix=$SITES" >> $GITHUB_OUTPUT
  shard_matrix:
    name: Test Shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Shard Matrix
        id: set-matrix
        run: |
          n=${{ vars.TEST_SHARDS || 3 }} &&
          numbers=($(seq 1 $n)) &&
          json=$(printf '%s\n' "${numbers[@]}" | jq -R . | jq -s -c .) &&
          echo "Test shards: $json" &&
          echo "matrix=$json" >> $GITHUB_OUTPUT
  codeception:
    name: Codeception
    needs: [sites_to_test, shard_matrix]
    strategy:
      fail-fast: false
      matrix:
        site: ${{fromJSON(needs.sites_to_test.outputs.matrix)}}
        suite: [acceptance, functional]
        shard: ${{fromJSON(needs.shard_matrix.outputs.matrix)}}
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
      options: '--network-alias drupal8ci'
    env:
      STANFORD_ENCRYPT: ${{secrets.STANFORD_ENCRYPT}}
    services:
      selenium:
        image: selenium/standalone-chrome:130.0
        options: '--shm-size="2g"'
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - name: Restore Cache
        uses: actions/cache@v6
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            4.x-${{ vars.CACHE_KEY }}-
      - name: Install Site
        run: |
          git config --system --add safe.directory '*' &&
          mysql -h mysql -P 3306 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;' &&
          rm -rf /var/www/html &&
          ln -snf $GITHUB_WORKSPACE /var/www/html &&
          mkdir -p -m 777 docroot/sites/default/files &&
          rm -rf docroot/sites/${{ matrix.site }}/files &&
          ln -sL ../default/files/ docroot/sites/${{ matrix.site }}/files &&
          apachectl stop &&
          apachectl start &&
          composer install -n &&
          drush drupal:install --site=${{ matrix.site }} -n &&
          drush image:derive thumbnail $(drush sql:query 'select uri from file_managed where uri like "%//media/%" limit 1') &&
          drush xmlsitemap:rebuild &&
          drush cr &&
          mkdir -p artifacts/_data/
      - name: Run tests
        run: |
          n=${{ vars.TEST_SHARDS || 3 }} &&
          PROFILE=`drush st --fields=install-profile --format=list` &&
          drush codeception --site-domain=localhost --suite=${{ matrix.suite }} --test-dir=docroot/profiles/lagunita/$PROFILE/tests/codeception --shard=${{ matrix.shard }}/$n &&
          if [ ! -f artifacts/report.html ]; then
            exit 1
          fi
      - name: Save Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.site }}-${{ matrix.suite }}-${{ matrix.shard }}-tests-results
          path: artifacts
  db_updates:
    name: DB Updates
    needs: sites_to_test
    strategy:
      fail-fast: false
      matrix:
        site: ${{fromJSON(needs.sites_to_test.outputs.matrix)}}
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
      options: '--network-alias drupal8ci'
    env:
      STANFORD_ENCRYPT: ${{secrets.STANFORD_ENCRYPT}}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - uses: actions/checkout@v7
      - name: Restore Cache
        uses: actions/cache@v6
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            4.x-${{ vars.CACHE_KEY }}-
      - name: Sync and Update Site
        id: sync
        run: |
          git config --system --add safe.directory '*' &&
          mysql -h mysql -P 3306 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;' &&
          rm -rf /var/www/html &&
          ln -snf $GITHUB_WORKSPACE /var/www/html &&
          mkdir -p -m 777 docroot/sites/default/files &&
          rm -rf docroot/sites/${{ matrix.site }}/files &&
          ln -sL ../default/files/ docroot/sites/${{ matrix.site }}/files &&
          apachectl stop &&
          apachectl start &&
          composer install -n &&
          drush sa @${{ matrix.site }}.prod || exit 0 &&
          drush drupal:sync --site=${{ matrix.site }} -n &&
          curl -I http://localhost --fail &&
          echo 'synced=true' >> $GITHUB_OUTPUT
      - name: Build Front End
        if: steps.sync.outputs.synced == 'true'
        env:
          BUILD_PAGES: ${{ vars.FRONTEND_BUILD_PAGES || 100 }}
          BUILD_COMPLETE: 'true'
          LIBGUIDE_CLIENT_ID: ${{secrets.LIBGUIDE_CLIENT_ID}}
          LIBGUIDE_CLIENT_SECRET: ${{secrets.LIBGUIDE_CLIENT_SECRET}}
        run: |
          # Each multisite is served by its own Next.js front end repository.
          case '${{ matrix.site }}' in
            csp) frontend_repo=csp-nextjs ;;
            library) frontend_repo=sulgryphon-nextjs ;;
            summer) frontend_repo=summer-nextjs ;;
            supress) frontend_repo=press-nextjs ;;
            *)
              echo 'No front end repository is configured for ${{ matrix.site }}.'
              exit 0
              ;;
          esac
          # Algolia is unreachable during the build, so drop its credentials.
          for algolia_table in config_pages__su_site_algolia_id config_pages__su_site_algolia_index config_pages__su_site_algolia_key; do
            drush sqlq "truncate $algolia_table" || true
          done
          git clone --depth 1 --single-branch "https://github.com/SU-SWS/$frontend_repo.git" $GITHUB_WORKSPACE/frontend &&
          cd $GITHUB_WORKSPACE/frontend &&
          cp .env.example .env.local &&
          sed -i -r "s|^#?NEXT_PUBLIC_DRUPAL_BASE_URL.*|NEXT_PUBLIC_DRUPAL_BASE_URL=http://localhost|g" .env.local &&
          # Not every .env.example ends in a newline, so the appended
          # credentials below would otherwise land on the last existing line.
          echo >> .env.local &&
          cd $GITHUB_WORKSPACE &&
          # Creates the next_site entity plus the service accounts the front end
          # authenticates with, then prints the matching credentials.
          drush su-next-connect >> $GITHUB_WORKSPACE/frontend/.env.local &&
          cd $GITHUB_WORKSPACE/frontend &&
          yarn &&
          yarn next telemetry disable &&
          yarn build
  all-tests-pass:
    name: All Tests Pass
    needs: [phpunit, codeception, db_updates]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Passed'
  something_failed:
    name: Something Failed
    if: failure()
    needs: [phpunit, codeception, db_updates]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "something failed"
          exit 1
  deploy:
    name: Deploy Artifact
    needs: [phpunit, codeception, db_updates]
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
    steps:
      - uses: actions/checkout@v7
      - name: Restore Cache
        uses: actions/cache@v6
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            4.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            4.x-${{ vars.CACHE_KEY }}-
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Deploy Artifact
        run: |
          git config --system --add safe.directory '*' &&
          git config --global user.email "sws-developers@lists.stanford.edu" &&
          git config --global user.name "Github Actions" &&
          ssh-keyscan -t rsa svn-45197.prod.hosting.acquia.com >> /root/.ssh/known_hosts &&
          ssh-keyscan -t rsa svn-23450.prod.hosting.acquia.com >> /root/.ssh/known_hosts &&
          composer install -n &&
          drush sws:artifact:deploy -v -n
