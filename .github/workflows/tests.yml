name: Tests
on: [push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v6
      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            3.x-${{ vars.CACHE_KEY }}-
      - name: Run Unit Tests
        env:
          CC_TEST_REPORTER_ID: ${{secrets.CC_TEST_REPORTER_ID}}
        run: |
          git config --system --add safe.directory '*' &&
          composer install -n &&
          mkdir -p docroot/sites/simpletest &&
          drush sws:source:tests:phpunit --db-host=mysql --db-pass=drupal --db-name=drupal --db-user=drupal --with-coverage &&
          drush sws:tests:phpunit-coverage-check artifacts/phpunit/coverage/xml --clover-file=artifacts/phpunit/coverage/clover.xml -n
      - name: Save Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-tests-results
          path: $GITHUB_WORKSPACE/artifacts
  sites_to_test:
    name: Sites to test
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            3.x-${{ vars.CACHE_KEY }}-
      - name: Get Sites
        id: set-matrix
        run: |
          composer install -n &&
          SITES=$(echo -n "$(drush sws:drush-config command.sws.options.multisites | grep -v default)" | jq -R -s -c 'split("\n") | sort') &&
          echo "matrix=$SITES" >> $GITHUB_OUTPUT
  shard_matrix:
    name: Test Shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Shard Matrix
        id: set-matrix
        run: |
          n=${{ vars.TEST_SHARDS || 3 }} &&
          numbers=($(seq 1 $n)) &&
          json=$(printf '%s\n' "${numbers[@]}" | jq -R . | jq -s -c .) &&
          echo "Test shards: $json" &&
          echo "matrix=$json" >> $GITHUB_OUTPUT
  codeception:
    name: Codeception
    needs: [sites_to_test, shard_matrix]
    strategy:
      fail-fast: false
      matrix:
        site: ${{fromJSON(needs.sites_to_test.outputs.matrix)}}
        suite: [acceptance, functional]
        shard: ${{fromJSON(needs.shard_matrix.outputs.matrix)}}
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
      options: '--network-alias drupal8ci'
    env:
      STANFORD_ENCRYPT: ${{secrets.STANFORD_ENCRYPT}}
    services:
      selenium:
        image: selenium/standalone-chrome:130.0
        options: '--shm-size="2g"'
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v6
      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            3.x-${{ vars.CACHE_KEY }}-
      - name: Install Site
        run: |
          git config --system --add safe.directory '*' &&
          mysql -h mysql -P 3306 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;' &&
          rm -rf /var/www/html &&
          ln -snf $GITHUB_WORKSPACE /var/www/html &&
          mkdir -p -m 777 docroot/sites/default/files &&
          rm -rf docroot/sites/${{ matrix.site }}/files &&
          ln -sL ../default/files/ docroot/sites/${{ matrix.site }}/files &&
          apachectl stop &&
          apachectl start &&
          composer install -n &&
          drush drupal:install --site=${{ matrix.site }} -n &&
          drush image:derive thumbnail $(drush sql:query 'select uri from file_managed where uri like "%//media/%" limit 1') &&
          drush xmlsitemap:rebuild &&
          drush cr &&
          mkdir -p artifacts/_data/
      - name: Run tests
        run: |
          n=${{ vars.TEST_SHARDS || 3 }} &&
          PROFILE=`drush st --fields=install-profile --format=list` &&
          drush codeception --site-domain=localhost --suite=${{ matrix.suite }} --test-dir=docroot/profiles/lagunita/$PROFILE/tests/codeception --shard=${{ matrix.shard }}/$n &&
          if [ ! -f artifacts/report.html ]; then
            exit 1
          fi
      - name: Save Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.site }}-${{ matrix.suite }}-${{ matrix.shard }}-tests-results
          path: artifacts
  db_updates:
    name: DB Updates
    needs: sites_to_test
    strategy:
      fail-fast: false
      matrix:
        site: ${{fromJSON(needs.sites_to_test.outputs.matrix)}}
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
      options: '--network-alias drupal8ci'
    env:
      STANFORD_ENCRYPT: ${{secrets.STANFORD_ENCRYPT}}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - uses: actions/checkout@v6
      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            3.x-${{ vars.CACHE_KEY }}-
      - name: Sync and Update Site
        run: |
          git config --system --add safe.directory '*' &&
          mysql -h mysql -P 3306 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;' &&
          rm -rf /var/www/html &&
          ln -snf $GITHUB_WORKSPACE /var/www/html &&
          mkdir -p -m 777 docroot/sites/default/files &&
          rm -rf docroot/sites/${{ matrix.site }}/files &&
          ln -sL ../default/files/ docroot/sites/${{ matrix.site }}/files &&
          apachectl stop &&
          apachectl start &&
          composer install -n &&
          drush sa @${{ matrix.site }}.prod || exit 0 &&
          drush drupal:sync --site=${{ matrix.site }} -n &&
          curl -I http://localhost --fail
  all-tests-pass:
    name: All Tests Pass
    needs: [phpunit, codeception, db_updates]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Passed'
  something_failed:
    name: Something Failed
    if: failure()
    needs: [phpunit, codeception, db_updates]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "something failed"
          exit 1
  deploy:
    name: Deploy Artifact
    needs: [phpunit, codeception, db_updates]
    runs-on: ubuntu-latest
    container:
      image: pookmish/drupal8ci:php8.3
    steps:
      - uses: actions/checkout@v6
      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            docroot/core
            docroot/libraries
            docroot/modules/contrib
          key: 3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-${{ hashFiles('composer.lock') }}
            3.x-${{ vars.CACHE_KEY }}-${{ hashFiles('composer.json') }}-
            3.x-${{ vars.CACHE_KEY }}-
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail
      - name: Deploy Artifact
        run: |
          git config --system --add safe.directory '*' &&
          git config --global user.email "sws-developers@lists.stanford.edu" &&
          git config --global user.name "Github Actions" &&
          ssh-keyscan -t rsa svn-45197.prod.hosting.acquia.com >> /root/.ssh/known_hosts &&
          ssh-keyscan -t rsa svn-23450.prod.hosting.acquia.com >> /root/.ssh/known_hosts &&
          composer install -n &&
          drush sws:artifact:deploy -v -n
