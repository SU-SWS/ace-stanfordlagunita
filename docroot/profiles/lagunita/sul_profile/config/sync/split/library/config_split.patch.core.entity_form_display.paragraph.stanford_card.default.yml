adding:
  dependencies:
    config:
      - field.field.paragraph.stanford_card.sul_card_image_caption
    module:
      - change_labels
      - conditional_fields
      - link_attributes
      - sul_helper
  content:
    su_card_body:
      weight: 4
    su_card_header:
      weight: 3
    su_card_link:
      type: link_attributes
      weight: 5
      region: content
      settings:
        enabled_attributes:
          aria-label: true
          id: false
          name: false
          target: false
          rel: false
          class: false
          accesskey: false
          title: false
        widget_default_open: expandIfValuesSet
      third_party_settings:
        change_labels:
          field_label_overwrite: ''
    su_card_media:
      weight: 1
    su_card_super_header:
      type: sul_branch_selector
      weight: 0
      region: content
    sul_card_image_caption:
      type: string_textfield
      weight: 2
      region: content
      settings:
        size: 60
        placeholder: ''
      third_party_settings:
        conditional_fields: {  }
removing:
  dependencies:
    module:
      - link
  content:
    su_card_body:
      weight: 3
    su_card_header:
      weight: 2
    su_card_link:
      type: link_default
      weight: 7
    su_card_media:
      weight: 0
    su_card_super_header:
      type: string_textfield
      weight: 8
