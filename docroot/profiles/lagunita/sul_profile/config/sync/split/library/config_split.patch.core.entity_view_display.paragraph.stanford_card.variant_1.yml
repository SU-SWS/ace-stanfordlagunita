adding:
  dependencies:
    config:
      - field.field.paragraph.stanford_card.sul_card_image_caption
      - field.field.paragraph.stanford_card.sul_card_super_head
  third_party_settings:
    ds:
      fields:
        'display_field_copy:paragraph-su_card_link_title':
          weight: 4
  content:
    su_card_body:
      weight: 2
    su_card_header:
      weight: 1
    su_card_link:
      weight: 3
    su_card_media:
      settings:
        remove_alt: false
    su_card_super_header:
      region: content
  hidden:
    sul_card_image_caption: true
    sul_card_super_head: true
removing:
  dependencies:
    config:
      - field.field.paragraph.stanford_card.su_card_super_header
  third_party_settings:
    ds:
      regions:
        card_super_headline:
          - su_card_super_header
      fields:
        'display_field_copy:paragraph-su_card_link_title':
          weight: 5
  content:
    su_card_body:
      weight: 3
    su_card_header:
      weight: 2
    su_card_link:
      weight: 4
    su_card_super_header:
      settings:
        link_to_entity: false
      region: card_super_headline
      type: string
      label: hidden
      weight: 1
  hidden:
    su_card_link_display: true
