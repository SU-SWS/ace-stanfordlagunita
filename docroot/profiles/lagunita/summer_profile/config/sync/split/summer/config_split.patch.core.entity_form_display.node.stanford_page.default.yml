adding:
  dependencies:
    config:
      - field.field.node.stanford_page.sum_search_exclude
    module:
      - search_api_exclude_entity
  content:
    su_page_banner:
      type: layout_paragraphs
      settings:
        view_mode: default
        preview_view_mode: default
        nesting_depth: 0
        require_layouts: 0
        empty_message: ''
    su_page_components:
      settings:
        preview_view_mode: sum_editing_preview
      third_party_settings:
        change_labels:
          field_label_overwrite: ''
          hide_add_another: 0
          force_single_cardinality: 0
    sum_search_exclude:
      type: search_api_exclude_entity_widget
      weight: 27
      region: content
      settings:
        field_label: 'Yes, exclude this entity from the search indexes.'
        use_details_container: true
      third_party_settings: {  }
removing:
  dependencies:
    module:
      - paragraphs
  content:
    su_page_banner:
      type: paragraphs
      settings:
        features:
          add_above: '0'
          collapse_edit_all: '0'
          convert: '0'
          duplicate: '0'
        title: Paragraph
        title_plural: Paragraphs
        edit_mode: closed
        closed_mode: preview
        autocollapse: none
        closed_mode_threshold: 0
        add_mode: dropdown
        default_paragraph_type: _none
    su_page_components:
      settings:
        preview_view_mode: default
