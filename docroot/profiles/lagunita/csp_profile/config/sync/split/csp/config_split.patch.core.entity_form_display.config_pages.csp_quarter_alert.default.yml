adding:
  dependencies:
    config:
      - field.field.config_pages.csp_quarter_alert.csp_qa_color
      - field.field.config_pages.csp_quarter_alert.csp_qa_enabled
      - field.field.config_pages.csp_quarter_alert.csp_qa_label
      - field.field.config_pages.csp_quarter_alert.csp_qa_text
    module:
      - options
      - text
  content:
    csp_qa_color:
      type: options_select
      weight: 3
      region: content
      settings: {  }
      third_party_settings: {  }
    csp_qa_enabled:
      type: boolean_checkbox
      weight: 0
      region: content
      settings:
        display_label: true
      third_party_settings: {  }
    csp_qa_label:
      type: string_textfield
      weight: 1
      region: content
      settings:
        size: 60
        placeholder: 'e.g., WINTER QUARTER 2025'
      third_party_settings: {  }
    csp_qa_text:
      type: text_textarea
      weight: 2
      region: content
      settings:
        rows: 3
        placeholder: ''
      third_party_settings: {  }
removing: {  }
