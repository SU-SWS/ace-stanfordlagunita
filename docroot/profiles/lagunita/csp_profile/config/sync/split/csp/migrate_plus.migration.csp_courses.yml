uuid: 3b75daa0-c8ae-4cfc-b95d-a76fd60bcb08
langcode: en
status: false
dependencies: {  }
id: csp_courses
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags: {  }
migration_group: stanford_courses
label: 'CSP Course importer'
source:
  authentication:
    plugin: oauth2_client
    grant_type: client_credentials
    provider_options:
      clientId: '[clientId]'
      clientSecret: '[clientSecret]'
      urlAuthorize: 'https://stanforduniversity3--devmain.sandbox.my.salesforce.com/services/oauth2/token'
      urlResourceOwnerDetails: 'https://stanforduniversity3--devmain.sandbox.my.salesforce.com/services/oauth2/token'
      urlAccessToken: 'https://stanforduniversity3--devmain.sandbox.my.salesforce.com/services/oauth2/token'
  track_changes: true
  plugin: url
  data_fetcher_plugin: http
  urls:
    - 'https://stanforduniversity3--devmain.sandbox.my.salesforce.com/services/apexrest/csp/products/v1/courses?page=1&pageSize=100'
    - 'https://stanforduniversity3--devmain.sandbox.my.salesforce.com/services/apexrest/csp/products/v1/courses?page=2&pageSize=100'
    - 'https://stanforduniversity3--devmain.sandbox.my.salesforce.com/services/apexrest/csp/products/v1/courses?page=3&pageSize=100'
  data_parser_plugin: json
  item_selector: courses
  fields:
    -
      name: id
      label: ID
      selector: id
    -
      name: title
      label: 'Course Title'
      selector: title
    -
      name: description
      label: Description
      selector: description
    -
      name: url
      label: URL
      selector: url
    -
      name: subjectArea
      label: subjectArea
      selector: subjectArea
    -
      name: instructors
      label: instructors
      selector: instructors
    -
      name: format
      label: format
      selector: format
    -
      name: department
      label: department
      selector: department
    -
      name: term
      label: term
      selector: term/name
    -
      name: shortTitle
      label: shortTitle
      selector: shortTitle
  ids:
    id:
      type: string
  constants:
    status: 1
    type: stanford_course
    stanford_html: stanford_html
process:
  status: constants/status
  title: title
  body/value:
    -
      plugin: skip_on_empty
      method: process
      source: description
    -
      plugin: str_replace
      regex: true
      search: /^(\w)/
      replace: '<p>$1'
    -
      plugin: str_replace
      regex: true
      search: /(\w)$/
      replace: $1</p>
  body/format: constants/stanford_html
  su_course_code: shortTitle
  csp_course_department: department
  csp_course_format: format
  su_course_link/uri: url
  su_course_link/title:
    plugin: default_value
    default_value: ''
  su_imported:
    plugin: default_value
    default_value: 1
  su_course_quarters:
    -
      plugin: skip_on_empty
      method: process
      source: term
    -
      plugin: entity_generate
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: su_course_quarters
      value_key: name
  su_course_subject:
    -
      plugin: skip_on_empty
      method: process
      source: subjectArea
    -
      plugin: entity_generate
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: su_course_subjects
      value_key: name
  su_course_instructors:
    -
      plugin: skip_on_empty
      method: process
      source: instructors
    -
      plugin: sub_process
      process:
        value: name
destination:
  plugin: 'entity:node'
  default_bundle: stanford_course
idMap: {  }
migration_dependencies: {  }
include: null
