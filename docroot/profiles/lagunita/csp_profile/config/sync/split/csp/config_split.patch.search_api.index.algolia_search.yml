          - taxonomy
    csp_course_department:
      label: Department
      datasource_id: 'entity:node'
      property_path: csp_course_department
      type: string
      dependencies:
        config:
          - field.storage.node.csp_course_department
    csp_course_format:
      label: Format
      datasource_id: 'entity:node'
      property_path: csp_course_format
      type: string
      dependencies:
        config:
          - field.storage.node.csp_course_format
    su_course_code:
      label: 'Course Code'
      datasource_id: 'entity:node'
      property_path: su_course_code
      type: string
      dependencies:
        config:
          - field.storage.node.su_course_code
    su_course_instructors:
      label: Instructors
      datasource_id: 'entity:node'
      property_path: su_course_instructors
      type: string
      dependencies:
        config:
          - field.storage.node.su_course_instructors
  processor_settings:
    book_fields: {  }
    html_filter:
      fields:
        - csp_course_department
        - csp_course_format
        - name
        - name_1
        - su_course_code
        - su_course_instructors
