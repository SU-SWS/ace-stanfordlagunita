adding:
  dependencies:
    config:
      - field.storage.node.csp_course_department
      - field.storage.node.csp_course_format
      - field.storage.node.su_course_code
      - field.storage.node.su_course_instructors
      - field.storage.node.su_course_quarters
    module:
      - book
  field_settings:
    course_quarters:
      label: 'Course Quarters » Taxonomy term » Name'
      datasource_id: 'entity:node'
      property_path: 'su_course_quarters:entity:name'
      type: string
