services:
  plugin.manager.install_tasks:
    class: Drupal\csp_profile\InstallTaskManager
    parent: default_plugin_manager
  csp_profile.event_subscriber:
    class: '\Drupal\csp_profile\EventSubscriber\StanfordProfileEventSubscriber'
    arguments: ['@file_system', '@http_client', '@logger.factory', '@messenger']
    tags:
      - { name: 'event_subscriber' }
  csp_profile.config_overrider:
    class: Drupal\csp_profile\Config\ConfigOverrides
    arguments: ['@state', '@config.factory']
    tags:
      - {name: config.factory.override, priority: -5}
