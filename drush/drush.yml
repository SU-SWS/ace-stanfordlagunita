drush:
  paths:
    config:
      - docroot/sites/default/local.drush.yml
      - ../docroot/sites/default/local.drush.yml
      - local.drush.yml
      - drush/local.drush.yml
      - drush/local.drush.yml
      - drush/local.drush.yml
  include:
    - '${env.home}/.drush'
    - /usr/share/drush/commands
project:
  profile: stanford_profile
  # Next.js front end repository for each multisite, keyed by the site name used
  # in `command.sws.options.multisites` below. All repositories are assumed to
  # live in the SU-SWS GitHub organization. CI builds the front end of every
  # site listed here against the synced database; a site with no entry is
  # skipped.
  frontend-repos:
    csp: csp-nextjs
    library: sulgryphon-nextjs
    summer: summer-nextjs
    supress: press-nextjs
command:
  sql:
    sanitize:
      options:
        ignored-roles: decoupled_site_users
  sws:
    options:
      git-url:
        - 'stanfordgryphon@svn-23450.prod.hosting.acquia.com:stanfordgryphon.git'
        - 'stanfordlagunita@svn-45197.prod.hosting.acquia.com:stanfordlagunita.git'
        - 'stanfordpress@svn-45197.prod.hosting.acquia.com:stanfordpress.git'
        - 'stanfordsummer@svn-45197.prod.hosting.acquia.com:stanfordsummer.git'
      post-build-script: drush/deploy-cleanup.sh
      artifact-dir: deploy
      alias-dir: drush/sites
      app-id: 12c62419-8d5c-40e1-b7ab-f7999e0cc3e9
      sync-ssh: stanfordlagunita.test@stanfordlagunitastg.ssh.prod.acquia-sites.com
      sync-files:
        - /mnt/gfs/stanfordlagunita.test/nobackup/simplesamlphp/
        - /mnt/gfs/stanfordlagunita.test/secrets.settings.php
        - /mnt/gfs/stanfordlagunita.test/nobackup/oauth/
      multisites:
        - csp
        - default
        - library
        - summer
        - supress
